[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "astrophotoflow-service"
version = "0.1.0"
description = "Local AstroPhotoFlow asset domain service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "astropy>=8.0.2",
  "blake3>=1.0.11",
  "fastapi>=0.115,<1",
  "filelock>=3.16,<4",
  "numpy>=2.4.6",
  "pillow>=13.0.0",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["aiohttp>=3.10,<4", "httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
apf-service = "astrophotoflow_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
