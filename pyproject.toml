[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "astrophotoflow"
version = "0.1.0"
description = "AstroPhotoFlow local CPU workstation and asset service"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["comfyui", "astrophotography", "assets", "mcp"]
dependencies = [
    "alembic>=1.14,<2",
    "astropy>=8.0.2",
    "blake3>=1.0.11",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "httpx>=0.27,<1",
    "mcp==2.3.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pillow-heif==1.1.1",
    "psutil>=6,<8",
    "rawpy==0.27.1",
    "sqlalchemy>=2.0,<3",
    "uv>=0.8,<1",
    "uvicorn>=0.32,<1",
    "xisf==0.9.7",
]

[project.optional-dependencies]
dev = ["aiohttp>=3.10,<4", "build>=1.2,<2", "pytest>=8,<9"]

[project.scripts]
apf = "astrophotoflow.cli:main"
apf-service = "astrophotoflow.interfaces.http.cli:main"

[project.urls]
bugs = "https://github.com/MaojieXu/AstroPhotoFlow/issues"
homepage = "https://github.com/MaojieXu/AstroPhotoFlow"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--import-mode=importlib --confcutdir=tests --basetemp=.artifacts/pytest"
cache_dir = ".artifacts/cache/pytest"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py312"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["astrophotoflow", "astrophotoflow.*"]
namespaces = false

[tool.setuptools.package-data]
"astrophotoflow.core" = ["locales/*.json"]
"astrophotoflow.interfaces.mcp" = ["locales/*.json"]
astrophotoflow = ["vendor/*.zip", "vendor/*.json", "vendor/*.lock", "vendor/*LICENSE"]
"astrophotoflow.core.database" = ["alembic.ini", "alembic/*.py", "alembic/versions/*.py"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
