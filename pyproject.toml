[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrophotoflow"
version = "0.1.0"
description = "AstroPhotoFlow local CPU workstation and asset service"
readme = "service/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["comfyui", "astrophotography", "assets", "mcp"]
dependencies = [
    "alembic>=1.14,<2",
    "astropy>=8.0.2",
    "blake3>=1.0.11",
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "httpx>=0.27,<1",
    "mcp==2.3.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pillow-heif==1.1.1",
    "psutil>=6,<8",
    "rawpy==0.27.1",
    "sqlalchemy>=2.0,<3",
    "uv>=0.8,<1",
    "uvicorn>=0.32,<1",
    "xisf==0.9.7",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9"]

[project.scripts]
apf = "astrophotoflow.cli:main"
apf-service = "astrophotoflow_service.cli:main"

[project.urls]
bugs = "https://github.com/MaojieXu/ComfyUI-AstroPhotoFlow/issues"
homepage = "https://github.com/MaojieXu/ComfyUI-AstroPhotoFlow"

[tool.pytest.ini_options]
minversion = "6.0"
# addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"
exclude = ["*cookiecutter.project_slug*"]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src", "astrophotoflow_service" = "service/src/astrophotoflow_service"}

[tool.setuptools.packages.find]
where = ["src", "service/src"]
include = ["astrophotoflow", "astrophotoflow.*", "astrophotoflow_service", "astrophotoflow_service.*"]
exclude = ["astrophotoflow.comfy_node.__pycache__"]

[tool.setuptools.package-data]
astrophotoflow = ["vendor/*.zip", "vendor/*.lock", "comfy_node/web/*"]
astrophotoflow_service = ["alembic.ini", "alembic/**/*"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
