name: Product checks

on:
  push:
  pull_request:

jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PROJECT_ENVIRONMENT: .artifacts/venvs/dev
      UV_CACHE_DIR: .artifacts/cache/uv
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Build frontend
        run: |
          corepack pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          corepack pnpm build
      - name: Discover browser tests (no services)
        run: corepack pnpm test:browser --list
      - name: Prepare Python project
        run: uv sync --locked --extra dev
      - name: Python product tests
        run: uv run --locked --no-sync pytest -q --junitxml=.artifacts/reports/python.xml
      - name: Frontend product tests
        run: corepack pnpm test
      - name: Build and verify distributions
        run: |
          uv run --locked --no-sync python -m build --installer uv --outdir .artifacts/dist
          uv run --locked --no-sync python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: .artifacts/reports/
